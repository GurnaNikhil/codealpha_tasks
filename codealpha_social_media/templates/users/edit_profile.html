{% extends "base.html" %}
{% block title %}Edit Profile - MiniSocial{% endblock %}
{% block content %}
<div class="form-container">
    <div class="form-card">
        <h1 class="form-card-title">Edit Profile</h1>
        <form method="POST" enctype="multipart/form-data" class="auth-form">
            {% csrf_token %}
            <div class="current-avatar-section">
                <img src="{{ profile.profile_picture.url }}" alt="Current avatar" class="profile-avatar-medium">
                <p>Current profile picture</p>
            </div>
            <div class="form-group">
                <label for="id_full_name">Full Name</label>
                {{ form.full_name }}
            </div>
            <div class="form-group">
                <label for="id_bio">Bio</label>
                {{ form.bio }}
            </div>
            <div class="form-group">
                <label for="id_profile_picture">Profile Picture</label>
                {{ form.profile_picture }}
                <span class="form-hint">Leave blank to keep current picture</span>
            </div>
            <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
        </form>
        <a href="{% url 'profile' username=user.username %}" class="btn btn-text btn-full">Cancel</a>
    </div>
</div>
{% endblock %}
