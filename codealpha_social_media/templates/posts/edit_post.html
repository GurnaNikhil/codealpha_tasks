{% extends "base.html" %}
{% block title %}Edit Post - MiniSocial{% endblock %}
{% block content %}
<div class="form-container">
    <div class="form-card">
        <h1 class="form-card-title">Edit Post</h1>
        <form method="POST" enctype="multipart/form-data" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <label for="id_content">Caption</label>
                {{ form.content }}
            </div>
            <div class="form-group">
                <label for="id_image">Image (optional)</label>
                {{ form.image }}
                <span class="form-hint">Upload a new image to replace the current one</span>
            </div>
            {% if post.image %}
                <div class="current-image-section">
                    <img src="{{ post.image.url }}" alt="Current post image" class="current-image-preview">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remove_image"> Remove current image
                    </label>
                </div>
            {% endif %}
            <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
        </form>
        <a href="{% url 'post_detail' post_id=post.id %}" class="btn btn-text btn-full">Cancel</a>
    </div>
</div>
{% endblock %}
